<div class="dashboard-container">
  <!-- Toolbar -->
  <header class="toolbar">
    <div class="toolbar-left">
      <button class="menu-toggle" (click)="toggleSidenav()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <img src="assets/images/logo.svg" alt="Logo" class="logo" />
    </div>
    <div class="toolbar-right">
      <span class="user-name">{{ currentUser?.username }}</span>
      <span class="rol-name">{{ currentUser?.rol }}</span>
    </div>
  </header>

  <div class="main-content">
    <!-- Sidenav -->
    <aside class="sidenav" [class.closed]="!sidenavOpen">
      <nav class="nav-menu">
        <a routerLink="/dashboard/usuarios" routerLinkActive="active" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Usuarios</span>
        </a>
        <a routerLink="/dashboard/empleados" routerLinkActive="active" class="nav-item">
          <svg width="22" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <!-- Persona -->
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>

            <!-- Portapapeles / Lista -->
            <rect x="18" y="4" width="7" height="10" rx="1"></rect>
            <line x1="19" y1="7" x2="21" y2="7"></line>
            <line x1="19" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Empleados</span>
        </a>
        <a routerLink="/dashboard/maquinaria-equipo" routerLinkActive="active" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <!-- Casco -->
            <path d="M4 15v-2a8 8 0 0 1 16 0v2"></path>

            <!-- Visera -->
            <path d="M2 15h20"></path>

            <!-- División del casco -->
            <path d="M12 7v3"></path>

            <!-- Soporte lateral -->
            <path d="M8 7.5v2.5"></path>
            <path d="M16 7.5v2.5"></path>
          </svg>

          <span>Maquinaria y Equipo</span>
        </a>
        <a routerLink="/dashboard/asignaciones" routerLinkActive="active" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <!-- Documento -->
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>

            <!-- Lista -->
            <line x1="9" y1="13" x2="15" y2="13"></line>
            <line x1="9" y1="17" x2="15" y2="17"></line>
            <line x1="9" y1="9" x2="13" y2="9"></line>
          </svg>
          <span>Asignaciones</span>
        </a>
        <button class="nav-item logout-item" (click)="logout()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </nav>
    </aside>

    <!-- Content Area -->
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
