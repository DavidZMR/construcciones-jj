<div class="usuarios-container">
  <div class="usuarios-header">
    <h1>Asignaciones</h1>
    <button class="btn-primary" (click)="openCreateModal()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      Crear Asignación
    </button>
  </div>

  @if(isLoading) {
  <div class="loading">Cargando Asignaciones...</div>
  } @else if(users.length === 0) {
  <div class="empty-state">No hay asignaciones registradas</div>
  } @else {
  <div class="form-group search">
    <input placeholder="Buscar..." (keyup)="applyFilter($event)" class="search-input" />
  </div>
  <div class="table-container">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z2">

      <!-- Usuario -->
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <!-- Rol -->
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
        <td mat-cell *matCellDef="let user">
          <span class="badge" [class.admin]="user.rol === 'admin'">
            {{ user.rol }}
          </span>
        </td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>

        <td mat-cell *matCellDef="let user" class="actions-cell">
          <button class="btn-icon btn-edit" (click)="openEditModal(user)" title="Editar">
            <img src="assets/icons/edit.svg" alt="">
          </button>

          <button class="btn-icon btn-delete" (click)="delete(user)" title="Eliminar">
            <img src="assets/icons/delete.svg" alt="">
          </button>
        </td>
      </ng-container>

      <!-- Definiciones -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons>
    </mat-paginator>
  </div>

  }
</div>
